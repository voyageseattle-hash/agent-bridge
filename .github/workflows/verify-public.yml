name: Verify public safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Scan tracked files and history
        run: npm run privacy:scan:history
      - name: Typecheck source
        run: npm run typecheck
      - name: Build source
        run: npm run build
      - name: Test the redacting scanner
        run: node --test test/privacy-scan.test.mjs
      - name: Run provider-disabled smoke check
        run: npm run smoke
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
